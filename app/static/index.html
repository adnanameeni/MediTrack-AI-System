<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediTrack AI - Sign in</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="bg-light">
  <main class="container auth-container">
    <h1 class="h3 text-center mb-1">MediTrack AI</h1>
    <p class="text-center text-muted mb-4">Track your health readings</p>

    <div class="alert alert-warning small" role="note">
      Development version. Please use fake test data only.
    </div>

    <div id="message" class="alert d-none" role="alert"></div>

    <div class="card shadow-sm">
      <div class="card-body">

        <form id="login-form" novalidate>
          <h2 class="h5 mb-3">Log in</h2>
          <div class="mb-3">
            <label for="login-email" class="form-label">Email</label>
            <input id="login-email" type="email" class="form-control" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="login-password" class="form-label">Password</label>
            <input id="login-password" type="password" class="form-control" autocomplete="current-password" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Log in</button>
          <p class="text-center mt-3 mb-0 small">
            No account yet?
            <button type="button" id="show-signup" class="btn btn-link btn-sm p-0 align-baseline">Sign up</button>
          </p>
        </form>

        <form id="signup-form" class="d-none" novalidate>
          <h2 class="h5 mb-3">Create an account</h2>
          <div class="mb-3">
            <label for="signup-name" class="form-label">Full name</label>
            <input id="signup-name" type="text" class="form-control" maxlength="200" autocomplete="name" required>
          </div>
          <div class="mb-3">
            <label for="signup-email" class="form-label">Email</label>
            <input id="signup-email" type="email" class="form-control" maxlength="255" autocomplete="email" required>
          </div>
          <div class="mb-3">
            <label for="signup-password" class="form-label">Password</label>
            <input id="signup-password" type="password" class="form-control" minlength="8" maxlength="128" autocomplete="new-password" required>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <button type="submit" class="btn btn-success w-100">Sign up</button>
          <p class="text-center mt-3 mb-0 small">
            Already have an account?
            <button type="button" id="show-login" class="btn btn-link btn-sm p-0 align-baseline">Log in</button>
          </p>
        </form>

      </div>
    </div>
  </main>

  <script src="/static/js/auth.js"></script>
</body>
</html>
